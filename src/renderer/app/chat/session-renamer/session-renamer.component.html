<p-dialog
  [visible]="visible()"
  header="Rename session"
  modal="true"
  closable="true"
  draggable="false"
  resizable="false"
  dismissableMask="true"
  (visibleChange)="visibleChange.emit($event)"
  styleClass="w-150 max-w-full"
>
  <div class="flex flex-col gap-4">
    <div>
      <label
        for="sessionName"
        class="mb-2 block text-sm font-medium"
      >
        New session name
      </label>
      <input
        id="sessionName"
        pInputText
        type="text"
        [(ngModel)]="newName"
        class="w-full"
        placeholder="Enter new session name"
        (keydown.enter)="save()"
      />
    </div>
  </div>

  <ng-template #footer>
    <p-button
      label="Cancel"
      severity="secondary"
      (onClick)="cancel()"
    >
      <ng-template #icon>
        <app-ui-icon name="xmark" />
      </ng-template>
    </p-button>
    <p-button
      label="Save"
      (onClick)="save()"
      [disabled]="!newName().trim()"
    >
      <ng-template #icon>
        <app-ui-icon name="check" />
      </ng-template>
    </p-button>
  </ng-template>
</p-dialog>
